<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件临时分享</title>
<style>body{max-width:650px;margin:60px auto;padding:24px;font:17px system-ui;background:#f5f7fb;color:#172338}input,button{display:block;margin:20px 0;padding:12px;max-width:95%}button{background:#245cdd;color:white;border:0;border-radius:8px;cursor:pointer}progress{width:100%}a{overflow-wrap:anywhere}small{color:#526078}</style>
<h1>上传文件，获取下载链接</h1><p>文件直接保存到服务器，24 小时后自动删除。单个文件最大 512 MB。</p><small>知道链接的人均可下载。当前使用 HTTP，暂不适合传输敏感文件。</small>
<form id="form"><input id="key" type="password" placeholder="输入上传口令" required autocomplete="current-password"><input id="file" type="file" required><button id="submit">上传并生成链接</button></form><progress id="progress" value="0" max="100"></progress><p id="status"></p><a id="link" hidden></a><button id="copy" hidden>复制链接</button>
<script>
const form=document.querySelector('#form'),file=document.querySelector('#file'),key=document.querySelector('#key'),statusEl=document.querySelector('#status'),link=document.querySelector('#link'),button=document.querySelector('#submit'),progress=document.querySelector('#progress'),copy=document.querySelector('#copy');
form.onsubmit=e=>{e.preventDefault();if(file.files[0].size>512*1048576){statusEl.textContent='文件超过 512 MB';return}button.disabled=true;link.hidden=copy.hidden=true;progress.value=0;statusEl.textContent='正在上传到服务器…';const data=new FormData();data.append('file',file.files[0]);const xhr=new XMLHttpRequest();xhr.open('POST','local-store.php');xhr.setRequestHeader('X-Upload-Key',key.value);xhr.timeout=3600000;xhr.upload.onprogress=e=>{if(e.lengthComputable){progress.value=e.loaded/e.total*100;statusEl.textContent=progress.value<100?'已发送 '+Math.floor(progress.value)+'%':'服务器正在保存，请稍候…'}};xhr.onload=()=>{button.disabled=false;try{const out=JSON.parse(xhr.responseText);if(out.code!==0)throw Error(out.msg);link.href=out.data.url;link.textContent=out.data.url;link.hidden=copy.hidden=false;statusEl.textContent='上传成功！链接有效期至 '+new Date(out.data.expires*1000).toLocaleString()}catch(err){statusEl.textContent='上传失败：'+(xhr.status===413?'文件超过服务器限制':err.message)}};xhr.onerror=xhr.ontimeout=()=>{button.disabled=false;statusEl.textContent='网络中断或超时，请重试'};xhr.send(data)};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(link.href);copy.textContent='已复制'}catch(e){const r=document.createRange();r.selectNodeContents(link);const s=getSelection();s.removeAllRanges();s.addRange(r);copy.textContent='链接已选中，请长按或按 Ctrl/Cmd+C 复制'}};
</script></html>
